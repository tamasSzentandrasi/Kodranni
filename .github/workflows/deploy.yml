name: Deploy Guidebook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch publish needs contents:write. The Actions Pages API (deploy-pages)
# has been hanging on a blank status until the 10-minute cancel.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Guidebook
        run: npm run build

      - name: Nest under /Guidebook + project portal at /
        run: |
          mkdir -p publish/Guidebook
          cp -a dist/. publish/Guidebook/
          cp public-root/index.html publish/index.html
          cp -a public-root/design publish/design
          node scripts/github-pages-prefix.mjs --self-test
          node scripts/github-pages-prefix.mjs publish/Guidebook
          test -f publish/design/primitives.css
          test -f publish/design/tokens.css
          test -f publish/design/ornament/btn-end-l.svg
          test -f publish/design/ornament/btn-end-r.svg
          test -f publish/design/ornament/corner-tl.svg
          grep -q '/Kodranni/Guidebook/_astro/' publish/Guidebook/introduction/index.html
          grep -q 'https://kodranni.com/Guidebook' publish/Guidebook/introduction/index.html

      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
