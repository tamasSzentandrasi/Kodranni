name: Release host tarball

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: chmod +x scripts/pack-linux.sh packaging/linux/install-user.sh
      - run: scripts/pack-linux.sh dist-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kodranni-host-linux
          path: dist-linux/*.tar.gz
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-linux/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "Linux host tarball. Unpack, npm ci --omit=dev, packaging/linux/install-user.sh." \
            --verify-tag || gh release upload "${GITHUB_REF_NAME}" dist-linux/*.tar.gz --clobber

  oci:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          img="ghcr.io/${{ github.repository_owner }}/kodranni:$(echo "${GITHUB_REF_NAME}" | tr 'A-Z' 'a-z')"
          docker build -t "$img" -t "ghcr.io/${{ github.repository_owner }}/kodranni:latest" .
          docker push "$img"
          docker push "ghcr.io/${{ github.repository_owner }}/kodranni:latest"
