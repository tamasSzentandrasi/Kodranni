name = "kodranni-edge"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
DEFAULT_CAMPAIGN = "vardmark"
GUIDE_ORIGIN = "https://tamasszentandrasi.github.io/Kodranni"

# demo = showcase (implied campaign). Apex = product + ?campaign= for tables.
[[routes]]
pattern = "demo.kodranni.com"
custom_domain = true
[[routes]]
pattern = "kodranni.com"
custom_domain = true
[[routes]]
pattern = "www.kodranni.com"
custom_domain = true

[[kv_namespaces]]
binding = "CAMPAIGNS"
id = "27f3b198669e4a619ed2645ae56b0365"
[[kv_namespaces]]
binding = "DEVICE_KEYS"
id = "033fbf4914bf4ebe8ebb391b69ae7972"
