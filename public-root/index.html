<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Kodranni</title>
	<meta name="description" content="Kodranni — pre-industrial grim human TTRPG. Source on GitHub; Guidebook on GitHub Pages." />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Bellefair&display=swap" rel="stylesheet" />
	<link rel="icon" href="./Guidebook/favicon.ico" sizes="any" />
	<link rel="icon" type="image/png" sizes="32x32" href="./Guidebook/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="./Guidebook/favicon-16x16.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="./Guidebook/apple-touch-icon.png" />
	<meta name="theme-color" content="#8a1515" />
	<style>
		:root {
			color-scheme: dark;
			--bg: #050505;
			--fg: #c8c8c8;
			--muted: #8a8a8a;
			--blood: #9b1c1c;
			--silver: #d4d4d4;
			--card: #0e0e0e;
			--border: #2a2a2a;
		}
		* { box-sizing: border-box; }
		html {
			font-synthesis: none;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			text-rendering: geometricPrecision;
		}
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 2rem 1.25rem;
			background: var(--bg);
			color: var(--fg);
			font-family: "Bellefair", Georgia, serif;
			font-size: 1.3rem;
			line-height: 1.5;
			font-synthesis: none;
			-webkit-text-stroke: 0;
			-webkit-text-fill-color: currentColor;
			text-shadow: none;
		}
		main {
			width: min(32rem, 100%);
			text-align: center;
		}
		.brand {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.65rem;
			margin-bottom: 0.35rem;
		}
		.brand img {
			width: 5rem;
			height: 5rem;
			object-fit: contain;
			border-radius: 50%;
			box-shadow: 0 0 0 2px color-mix(in srgb, var(--blood) 55%, transparent);
		}
		h1 {
			margin: 0;
			font-family: "Bellefair", Georgia, serif;
			font-size: clamp(2.75rem, 10vw, 4rem);
			font-weight: 400;
			color: var(--silver);
			letter-spacing: 0.01em;
			font-synthesis: none;
			-webkit-text-stroke: 0;
			-webkit-text-fill-color: currentColor;
			text-shadow: none;
		}
		.tag {
			margin: 0 0 2rem;
			color: var(--muted);
			font-size: 1rem;
		}
		.cards {
			display: grid;
			gap: 1rem;
		}
		a.card {
			display: block;
			padding: 1.25rem 1.35rem;
			border: 1px solid var(--border);
			border-radius: 0.75rem;
			background: var(--card);
			color: inherit;
			text-decoration: none;
			transition: border-color 0.15s ease, background 0.15s ease;
		}
		a.card:hover,
		a.card:focus-visible {
			border-color: var(--blood);
			background: #141010;
			outline: none;
		}
		a.card strong {
			display: block;
			margin-bottom: 0.35rem;
			font-size: 1.35rem;
			color: var(--silver);
		}
		a.card span {
			display: block;
			color: var(--muted);
			font-size: 0.95rem;
		}
		.note {
			margin-top: 1.75rem;
			font-size: 0.85rem;
			color: var(--muted);
		}
		.note code {
			font-family: ui-monospace, monospace;
			font-size: 0.8em;
			color: #aaa;
		}
	</style>
</head>
<body>
	<main>
		<div class="brand">
			<img src="./Guidebook/falcon-logo.png" width="80" height="80" alt="Kodranni falcon" />
			<h1>Kodranni</h1>
		</div>
		<p class="tag">Pre-industrial. Human. Grim.</p>
		<div class="cards">
			<a class="card" href="https://github.com/tamasszentandrasi/Kodranni">
				<strong>GitHub repository</strong>
				<span>Source, issues, plans, and history — the project home.</span>
			</a>
			<a class="card" href="./Guidebook/introduction/">
				<strong>Guidebook</strong>
				<span>Rules and procedures — start at the Introduction.</span>
			</a>
		</div>
		<p class="note">
			This page is the project entry; the docs live under <code>/Guidebook/</code>.
		</p>
	</main>
</body>
</html>
